[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scopecrawl"
version = "0.1.0"
description = "Scope-aware, low-impact bug-bounty reconnaissance CLI"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scopecrawl = "bountyhunter.cli:main"
bountyhunter = "bountyhunter.cli:main"

[tool.setuptools.packages.find]
include = ["bountyhunter*"]
